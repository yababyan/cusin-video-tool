name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean VideoTool.spec
      - name: Prepare Windows artifact
        shell: pwsh
        run: Move-Item dist/VideoTool.exe dist/CUSINI_ROYAL_VIDEO_TOOL.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/CUSINI_ROYAL_VIDEO_TOOL.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build macOS application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name "CUSINI ROYAL VIDEO TOOL"
          --add-data "images.jpg:."
          --add-data "dota2-logo.png:."
          --add-data "retro-watermark.png:."
          --add-data "mode-compress.png:."
          --add-data "mode-trim.png:."
          --add-data "mode-retro.png:."
          --add-data "mode-gif.png:."
          --add-data "mode-custom.png:."
          --add-data "DotA2MinimapIcons_AgADagwAAsd2IVA.png:."
          compress_video.py
      - name: Archive macOS application
        run: ditto -c -k --sequesterRsrc --keepParent "dist/CUSINI ROYAL VIDEO TOOL.app" "dist/CUSINI_ROYAL_VIDEO_TOOL_macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/CUSINI_ROYAL_VIDEO_TOOL_macOS.zip

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CUSINI ROYAL VIDEO TOOL ${GITHUB_REF_NAME}" \
            --notes "Новый интерфейс: один экран вместо четырёх вкладок — файл, фрагмент, что сделать.

          Изменения:
          - режим «В Discord»: обрезка и сжатие за один проход, файл гарантированно влезает в лимит (по умолчанию 15 МБ, есть 10/25/50/500);
          - битрейт, разрешение и FPS подбираются под длину фрагмента, двухпроходное кодирование;
          - «Шакал 2000-х» теперь 4:3 (640x480) и тоже укладывается в лимит;
          - GIF можно делать из любого видео, с обрезкой и кропом 1:1 / 4:3 / 16:9;
          - фрагмент работает во всех режимах, по умолчанию берётся всё видео;
          - настоящий прогресс в процентах, кнопка «Показать файл» выделяет результат в проводнике;
          - длительность и размер кадра определяются и в .exe-сборке (без ffprobe);
          - консольная команда export для тех же сценариев."
